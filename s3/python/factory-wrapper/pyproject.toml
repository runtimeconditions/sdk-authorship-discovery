[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-s3-factory-wrapper"
version = "0.1.0"
description = "Application-wrapped boto3 factory scenario for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["boto3==1.43.70"]

[project.scripts]
s3-factory-upload = "s3_factory_wrapper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

