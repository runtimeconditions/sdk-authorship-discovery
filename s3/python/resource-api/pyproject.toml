[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-s3-resource-api"
version = "0.1.0"
description = "boto3 S3 resource API scenario for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["boto3==1.43.70"]

[project.scripts]
s3-resource-upload = "s3_resource_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

