[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-s3-managed-transfer"
version = "0.1.0"
description = "boto3-to-s3transfer managed upload scenario for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["boto3==1.43.70"]

[project.scripts]
s3-managed-upload = "s3_managed_transfer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
