[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-s3-dynamic-service"
version = "0.1.0"
description = "Dynamically selected boto3 service scenario for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["boto3==1.43.70"]

[project.scripts]
sdk-dynamic-upload = "s3_dynamic_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

