[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-s3-dependency-injection"
version = "0.1.0"
description = "Dependency-injected boto3 S3 client scenario for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["boto3==1.43.70"]

[project.scripts]
s3-injected-upload = "s3_dependency_injection.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

