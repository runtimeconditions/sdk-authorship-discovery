schemaVersion: 1
id: aws-python-s3
description: Historical maintenance experiment for owner-aligned AWS SDK for Python S3 mappings
extensionPath: aws-s3
extensionRepository: https://github.com/runtimeconditions/extensions.git
packages:
  boto3:
    repository: https://github.com/boto/boto3.git
    versionFile: boto3/__init__.py
    packageDirectory: boto3
    indexPath: boto3/runtimeconditions/index.yaml
    mappingDestination: boto3/runtimeconditions/mappings/aws-s3.yaml
    packageDataPatch: authorship/aws-python/patches/boto3-package-data.patch
  botocore:
    repository: https://github.com/boto/botocore.git
    versionFile: botocore/__init__.py
    packageDirectory: botocore
    indexPath: botocore/runtimeconditions/index.yaml
    mappingDestination: botocore/runtimeconditions/mappings/aws-s3.yaml
    packageDataPatch: authorship/aws-python/patches/botocore-package-data.patch
  s3transfer:
    repository: https://github.com/boto/s3transfer.git
    versionFile: s3transfer/__init__.py
    packageDirectory: s3transfer
    indexPath: s3transfer/runtimeconditions/index.yaml
    mappingDestination: s3transfer/runtimeconditions/mappings/aws-s3.yaml
    packageDataPatch: authorship/aws-python/patches/s3transfer-package-data.patch
applicationTests:
- s3/python/direct-client
- s3/python/session-client
- s3/python/factory-wrapper
- s3/python/dependency-injection
- s3/python/resource-api
- s3/python/dynamic-service
- s3/python/managed-transfer
