name: Ongoing SDK mapping maintenance

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      extensions_ref:
        description: Immutable runtimeconditions/extensions commit or review ref
        required: true
        default: main
        type: string
      validation_level:
        description: Run static gates only or the full package and application proof
        required: true
        default: full
        type: choice
        options:
          - full
          - static

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: aws-python-s3-ongoing-maintenance
  cancel-in-progress: false

jobs:
  observe-compatible-root-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out SDK authorship experiment
        uses: actions/checkout@v6
        with:
          path: sdk

      - name: Check out accepted extension semantics
        uses: actions/checkout@v6
        with:
          repository: runtimeconditions/extensions
          ref: ${{ inputs.extensions_ref || 'main' }}
          path: extensions

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and runtime prerequisites
        run: python -m pip install --disable-pip-version-check -r sdk/authorship/aws-python/requirements.txt

      - name: Resolve the newest compatible owner graph
        id: candidate
        run: |
          python sdk/authorship/aws-python/tools/resolve_release_candidate.py \
            --experiment sdk/maintenance/aws-python-s3/experiment.yaml \
            --state sdk/maintenance/aws-python-s3/observations.yaml \
            --extensions-root extensions \
            --source-cache "$RUNNER_TEMP/upstream-source-cache" \
            --output "$RUNNER_TEMP/release-candidate.yaml"
          echo "available=$(python -c 'import sys,yaml; print(str(yaml.safe_load(open(sys.argv[1]))["hasCandidate"]).lower())' "$RUNNER_TEMP/release-candidate.yaml")" >> "$GITHUB_OUTPUT"
          echo "id=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["release"]["id"])' "$RUNNER_TEMP/release-candidate.yaml")" >> "$GITHUB_OUTPUT"

      - name: Check for an observation already awaiting review
        id: pending
        if: steps.candidate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_ID: ${{ steps.candidate.outputs.id }}
        run: |
          branch="automation/aws-python-s3-$OBSERVATION_ID"
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          echo "exists=$([[ -n "$existing" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "number=$existing" >> "$GITHUB_OUTPUT"

      - name: Run mapping maintenance
        id: maintenance
        if: steps.candidate.outputs.available == 'true' && steps.pending.outputs.exists != 'true'
        continue-on-error: true
        env:
          VALIDATION_LEVEL: ${{ inputs.validation_level || 'full' }}
        run: |
          arguments=()
          if [[ "$VALIDATION_LEVEL" == "static" ]]; then
            arguments+=(--static-only)
          fi
          python sdk/authorship/aws-python/tools/run_release_maintenance.py \
            --experiment sdk/maintenance/aws-python-s3/experiment.yaml \
            --release-file "$RUNNER_TEMP/release-candidate.yaml" \
            --extensions-root extensions \
            --source-cache "$RUNNER_TEMP/upstream-source-cache" \
            --work-root "$RUNNER_TEMP/maintenance-work" \
            --output "maintenance-evidence/${{ steps.candidate.outputs.id }}" \
            "${arguments[@]}"

      - name: Read maintenance classification
        id: result
        if: steps.candidate.outputs.available == 'true' && hashFiles(format('maintenance-evidence/{0}/run.yaml', steps.candidate.outputs.id)) != ''
        run: echo "classification=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["classification"])' "maintenance-evidence/${{ steps.candidate.outputs.id }}/run.yaml")" >> "$GITHUB_OUTPUT"

      - name: Record durable observation
        if: steps.result.outputs.classification == 'automatic' || steps.result.outputs.classification == 'extension-review-required' || steps.result.outputs.classification == 'sdk-review-required'
        run: |
          python sdk/authorship/aws-python/tools/record_release_observation.py \
            --state sdk/maintenance/aws-python-s3/observations.yaml \
            --candidate "$RUNNER_TEMP/release-candidate.yaml" \
            --run "maintenance-evidence/${{ steps.candidate.outputs.id }}/run.yaml" \
            --report "maintenance-evidence/${{ steps.candidate.outputs.id }}/report.md" \
            --evidence-root sdk/evidence/aws-python/ongoing

      - name: Open or update the observation pull request
        if: steps.result.outputs.classification == 'automatic' || steps.result.outputs.classification == 'extension-review-required' || steps.result.outputs.classification == 'sdk-review-required'
        working-directory: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_ID: ${{ steps.candidate.outputs.id }}
          CLASSIFICATION: ${{ steps.result.outputs.classification }}
          REPORT: evidence/aws-python/ongoing/${{ steps.candidate.outputs.id }}/report.md
        run: |
          branch="automation/aws-python-s3-$OBSERVATION_ID"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          git config user.name "runtimeconditions-maintenance[bot]"
          git config user.email "runtimeconditions-maintenance[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add maintenance/aws-python-s3/observations.yaml "evidence/aws-python/ongoing/$OBSERVATION_ID"
          git commit -m "Record AWS Python SDK maintenance observation $OBSERVATION_ID"
          if [[ -z "$remote_sha" ]]; then
            git push origin "HEAD:refs/heads/$branch"
          else
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          fi
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "AWS Python SDK observation: $OBSERVATION_ID ($CLASSIFICATION)" --body-file "$REPORT"
          else
            gh pr comment "$existing" --body "The observation was regenerated by workflow run $GITHUB_RUN_NUMBER. Classification: \`$CLASSIFICATION\`."
          fi

      - name: Create or update a focused review issue
        if: steps.result.outputs.classification == 'extension-review-required' || steps.result.outputs.classification == 'sdk-review-required' || steps.result.outputs.classification == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ steps.result.outputs.classification }}
          OBSERVATION_ID: ${{ steps.candidate.outputs.id }}
          REPORT: maintenance-evidence/${{ steps.candidate.outputs.id }}/report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="AWS Python SDK maintenance: $OBSERVATION_ID ($CLASSIFICATION)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body-file "$REPORT"
          else
            gh issue comment "$existing" --body "The condition was observed again in [workflow run $GITHUB_RUN_NUMBER]($RUN_URL)."
          fi

      - name: Upload complete maintenance evidence
        if: always() && steps.candidate.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aws-python-ongoing-maintenance-${{ github.run_id }}
          path: |
            maintenance-evidence/${{ steps.candidate.outputs.id }}
            ${{ runner.temp }}/release-candidate.yaml
          if-no-files-found: error
          retention-days: 90

      - name: Publish maintenance summary
        if: always() && steps.candidate.outputs.available == 'true' && hashFiles(format('maintenance-evidence/{0}/report.md', steps.candidate.outputs.id)) != ''
        run: cat "maintenance-evidence/${{ steps.candidate.outputs.id }}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report no new observation
        if: steps.candidate.outputs.available == 'false'
        run: echo "The latest compatible boto3-rooted owner graph and selected extension semantic digest have already been observed." >> "$GITHUB_STEP_SUMMARY"

      - name: Report observation awaiting review
        if: steps.pending.outputs.exists == 'true'
        run: echo "Observation ${{ steps.candidate.outputs.id }} is already awaiting review in pull request #${{ steps.pending.outputs.number }}; the expensive maintenance proof was not repeated." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce maintenance classification
        if: steps.candidate.outputs.available == 'true' && steps.pending.outputs.exists != 'true' && steps.result.outputs.classification != 'automatic'
        run: exit 1
