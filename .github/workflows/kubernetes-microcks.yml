name: Kubernetes SDK Microcks verification

on:
  pull_request:
    paths:
      - .github/workflows/kubernetes-microcks.yml
      - authorship/kubernetes-go-microcks-demo/**
  push:
    branches: [main]
    paths:
      - .github/workflows/kubernetes-microcks.yml
      - authorship/kubernetes-go-microcks-demo/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-microcks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: authorship/kubernetes-go-microcks-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: authorship/kubernetes-go-microcks-demo/go.sum

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Acquire pinned inputs and Go dependencies
        run: |
          go mod download all
          python prepare.py

      - name: Start Microcks container
        run: |
          docker run -d --name microcks-verify \
            -p 127.0.0.1:8585:8080 \
            -e SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB \
            -e SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=12MB \
            -e MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0 \
            -e MANAGEMENT_OTLP_LOGS_EXPORT_ENABLED=false \
            -e OTEL_LOGS_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            quay.io/microcks/microcks-uber:latest-native
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8585/api/services >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Microcks failed to become ready within 60s" >&2
          docker logs microcks-verify || true
          exit 1

      - name: Verify SDK requests against real Microcks traces
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOWORK: "off"
          GOFLAGS: "-mod=readonly -buildvcs=false"
          CGO_ENABLED: "0"
        run: |
          go test -count=1 ./...
          python -m unittest -v test_evidence.py
          python prepare.py --check
          go vet ./...
          go mod verify
          python verify.py --host http://127.0.0.1:8585

      - name: Collect Microcks container logs on failure
        if: failure()
        run: docker logs microcks-verify || true

      - name: Clean up Microcks container
        if: always()
        run: docker rm -f microcks-verify || true
