name: NATS Go SDK authorship

on:
  pull_request:
    paths:
      - .github/workflows/nats-go.yml
      - authorship/nats-go/**
      - nats/go/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/nats-go.yml
      - authorship/nats-go/**
      - nats/go/**
  workflow_dispatch:
    inputs:
      extensions_ref:
        description: Immutable runtimeconditions/extensions commit or review ref
        required: true
        default: main
        type: string
      profiler_ref:
        description: Immutable runtimeconditions/go-rc-profiler commit or review ref
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  pinned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out SDK authorship experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: sdk

      - name: Check out extension semantics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: runtimeconditions/extensions
          ref: ${{ inputs.extensions_ref || 'main' }}
          path: extensions

      - name: Check out Go profiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: runtimeconditions/go-rc-profiler
          ref: ${{ inputs.profiler_ref || 'main' }}
          path: go-rc-profiler

      - name: Check out pinned nats.go source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nats-io/nats.go
          ref: db1375fcffae2eb0b4ced1b7bad4d47c4447e4ac
          path: nats-go-source

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            sdk/authorship/nats-go/tools/go.sum
            go-rc-profiler/go.sum
            sdk/nats/go/complete-service/go.sum

      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check --requirement sdk/authorship/nats-go/requirements.txt

      - name: Test service-mapping compilation
        run: python -m unittest discover --start-directory sdk/authorship/nats-go/tests --pattern 'test_*.py'

      - name: Regenerate and compare the SDK mapping
        run: |
          python sdk/authorship/nats-go/tools/generate_mapping.py \
            --annotations sdk/authorship/nats-go/annotations/go.yaml \
            --service-mapping extensions/nats-service/model/generated/nats-service-mapping.yaml \
            --extension extensions/nats-service/releases/0.1.0/runtimeconditions.extension.yaml \
            --output "$RUNNER_TEMP/runtimeconditions.sdk-mapping.yaml"
          cmp sdk/authorship/nats-go/mappings/runtimeconditions.sdk-mapping.yaml "$RUNNER_TEMP/runtimeconditions.sdk-mapping.yaml"

      - name: Rebuild and compare the public-surface classification
        working-directory: sdk/authorship/nats-go/tools
        run: |
          go run . \
            --sdk-root "$GITHUB_WORKSPACE/nats-go-source" \
            --mapping ../mappings/runtimeconditions.sdk-mapping.yaml \
            --coverage-policy ../maintenance/surface-policy.yaml \
            --coverage-output "$RUNNER_TEMP/surface-coverage.yaml"
          cmp ../results/surface-coverage.yaml "$RUNNER_TEMP/surface-coverage.yaml"

      - name: Build the Go profiler
        working-directory: go-rc-profiler
        run: go build -o "$RUNNER_TEMP/go-rc-profiler" .

      - name: Run real-profiler fixture acceptance
        run: |
          python sdk/authorship/nats-go/tools/verify_fixtures.py \
            --profiler "$RUNNER_TEMP/go-rc-profiler" \
            --sdk-source nats-go-source \
            --mapping sdk/authorship/nats-go/mappings/runtimeconditions.sdk-mapping.yaml \
            --fixtures-root sdk/nats/go \
            --extensions-root extensions \
            --expected-root sdk/authorship/nats-go/results/profiles

      - name: Run Go profiler regression suite
        working-directory: go-rc-profiler
        run: go test ./...
