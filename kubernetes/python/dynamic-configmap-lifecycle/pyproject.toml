[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-sdk-kubernetes-dynamic-configmap-lifecycle"
version = "0.1.0"
description = "Kubernetes DynamicClient ConfigMap lifecycle for Runtime Conditions SDK mapping research"
requires-python = ">=3.10"
dependencies = ["kubernetes==36.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
