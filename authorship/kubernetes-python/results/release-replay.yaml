method:
  baseline: The integration generator was developed against Kubernetes Python v36.0.3 and then replayed backward against v36.0.0 through v36.0.3.
  scope: The replay records final compatibility and maintenance encountered during replay. The substantial first-integration work needed to create the projection, mapping, packaging, and verification pipeline is documented by the authorship project but is not counted as recurring release maintenance.
  limitation: This method establishes compatibility of the final generator with historical releases but does not reproduce the order or effort of a production integration maintained as each release occurred.
