  description: The initial retrospective replay rejected v36.0.0 because the projection required both synchronous and asynchronous generated API directories, while that release contained only the synchronous flavor. The generator was changed to discover and validate the flavors present in each release.
  authoredComponent: authorship/kubernetes-python/tools/project_surface.py
  semanticMappingEdits: 0
  productionInterpretation: This was real authored integration work, not an SDK semantic annotation change. In an upstream integration, SDK maintainers would still need to review and ship the change even if Runtime Conditions contributors supplied it. Because the experiment began at v36.0.3 and replayed backward, it does not establish exactly when a chronological production integration would have encountered the issue.
