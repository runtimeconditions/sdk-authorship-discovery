apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: nats-python-jetstream-publisher
workload:
  uri: https://github.com/runtimeconditions/sdk-authorship-discovery/tree/main/nats/python/jetstream-publisher
  version: 0.1.0
extensions:
- https://runtimeconditions.io/extensions/nats-service/0.1.0/runtimeconditions.extension.yaml
conditions:
- kind: nats
  interface:
    type: service
    operations:
    - resource: connection
      action: connect
    - resource: stream
      action: create
      name: ORDERS
      subjects:
      - orders.*
    - resource: stream
      action: update
      name: ORDERS
      subjects:
      - orders.*
      - returns.*
    - resource: stream
      action: inspect
      name: ORDERS
    - resource: stream
      action: publish
      subject: orders.created
    - resource: stream
      action: publish
      subject: orders.updated
    - resource: stream
      action: delete
      name: ORDERS
